<style>
/* Layout: graphite management shell — persistent rail (desktop) / bottom bar (phone), ivory work panels, optional detail pane.
   The agenda screen alone switches to ruled notebook paper. */
:root{
  color-scheme:dark;
  --shell:#17191c; --shell-2:#202327; --shell-3:#2a2e33; --shell-ink:#e8e5dd; --shell-dim:#9a9a94; --shell-line:#34383e;
  --panel:#ebe6da; --panel-2:#f5f1e7; --ink:#1b1c1e; --dim:#5d5b55; --line:#cfc8b8;
  --okfilm:#c7772e; --institute:#8a3f6b; --school:#1f8a8a;
  --good:#2f7d4f; --warn:#9a6a00; --bad:#b3362c; --info:#35608f;
  --paper:#f3ecd9; --paper-rule:#d9cfb6; --ribbon:#8a2a2a;
  --band:var(--shell-3);
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-paper:"Newsreader",Georgia,serif;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --shell:#dedbd3; --shell-2:#d0ccc3; --shell-3:#c2beb4; --shell-ink:#1b1c1e; --shell-dim:#5a5953; --shell-line:#b4afa4;
  --panel:#fbf9f3; --panel-2:#ffffff; --ink:#1b1c1e; --dim:#5d5b55; --line:#d8d2c4;
  --okfilm:#a85f1c; --institute:#7a3460; --school:#17706f;
  --good:#256b42; --warn:#8a5e00; --bad:#a32f26; --info:#2c5380;
  --paper:#f6f0df; --paper-rule:#ddd3bb; --ribbon:#8a2a2a;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --shell:#dedbd3; --shell-2:#d0ccc3; --shell-3:#c2beb4; --shell-ink:#1b1c1e; --shell-dim:#5a5953; --shell-line:#b4afa4;
  --panel:#fbf9f3; --panel-2:#ffffff; --ink:#1b1c1e; --dim:#5d5b55; --line:#d8d2c4;
  --okfilm:#a85f1c; --institute:#7a3460; --school:#17706f;
  --good:#256b42; --warn:#8a5e00; --bad:#a32f26; --info:#2c5380;
  --paper:#f6f0df; --paper-rule:#ddd3bb; --ribbon:#8a2a2a;
}
/* 'Menajer' skin: dense dark management-game look (original design). Tokens only; placed last so it wins. */
:root[data-skin="menajer"]{
  color-scheme:dark;
  --shell:#12141b; --shell-2:#1a1d27; --shell-3:#272b39; --shell-ink:#eef0f6; --shell-dim:#8f96aa; --shell-line:#2e3344;
  --panel:#1d212d; --panel-2:#262b3a; --ink:#e9ebf2; --dim:#99a0b4; --line:#333a4d;
  --okfilm:#e08a3c; --institute:#bb6aa6; --school:#35b3b0;
  --good:#3fbf7a; --warn:#e0b040; --bad:#ef6a5e; --info:#6aa6f0;
}
body[data-office="okfilm"]{--band:var(--okfilm)} body[data-office="institute"]{--band:var(--institute)} body[data-office="school"]{--band:var(--school)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--shell);color:var(--shell-ink);font:14px/1.5 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;min-height:100%;padding-block:12px 16px}

.mast .l4{font-size:11.5px;color:var(--shell-dim);margin-top:5px;line-height:1.35}
nav.main{display:flex;flex-direction:column;gap:2px}

  text-decoration:none;font-family:var(--f-display);font-size:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}

.ava{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--f-display);font-weight:600;font-size:13px;color:#fff;flex:none}
.ava.okfilm{background:var(--okfilm)} .ava.institute{background:var(--institute)} .ava.school{background:var(--school)}

.offsw{display:flex;border:1px solid var(--shell-line);border-radius:3px;overflow:hidden}
.offsw button{background:none;border:0;border-right:1px solid var(--shell-line);padding:6px 11px;font-family:var(--f-display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--shell-dim)}
.offsw button:last-child{border-right:0}
.offsw button[aria-pressed="true"]{background:var(--shell-3);color:var(--shell-ink)}
.offsw button[data-o="okfilm"][aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--okfilm)}
.offsw button[data-o="institute"][aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--institute)}

.btn{border:1px solid var(--shell-line);background:var(--shell-2);color:var(--shell-ink);padding:6px 12px;border-radius:3px;font-family:var(--f-display);font-size:14.5px;letter-spacing:.05em;text-transform:uppercase}
.btn:hover{background:var(--shell-3)}

.panel .btn:hover{background:var(--panel)}
.panel .btn.go{background:var(--good);border-color:var(--good);color:#fff}
.panel .btn.no{background:none;border-color:var(--bad);color:var(--bad)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.75}
.notice{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent);padding:8px 12px;border-radius:3px;font-size:13px}
/* panels */
.panel{background:var(--panel);color:var(--ink);border-radius:4px;padding:14px 16px;min-width:0}
.panel h2{font-size:21px;text-transform:uppercase}
.panel h3{font-size:16px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.panel .lbl{color:var(--dim)}
.panel p{margin:0 0 .7em;max-width:68ch}
.panel a{color:var(--info)}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px;align-items:start}
.off-okfilm{border-top:4px solid var(--okfilm)} .off-institute{border-top:4px solid var(--institute)} .off-school{border-top:4px solid var(--school)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
.dot.okfilm{background:var(--okfilm)} .dot.institute{background:var(--institute)} .dot.school{background:var(--school)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px}
.kv dt{color:var(--dim)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}

td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover td{background:var(--panel-2)} tr.sel td{background:var(--panel-2);box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--info) 8%,transparent)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.st{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.st.awaiting_review,.st.awaiting_approval{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.st.accepted{color:var(--good)} .st.failed{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}

.st.unsent{color:var(--bad);border-style:dashed}
.tag{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);color:var(--dim);padding:0 5px;border-radius:2px;white-space:nowrap}
.tag.v{border-color:var(--good);color:var(--good)} .tag.o{border-style:dashed;border-color:var(--warn);color:var(--warn)} .tag.x{border-color:var(--bad);color:var(--bad)}
pre.art{font-family:var(--f-mono);font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel-2);border:1px solid var(--line);padding:12px;margin:8px 0 0;max-height:56vh;overflow:auto;border-radius:3px}
pre.cmd{font-family:var(--f-mono);font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel-2);border:1px dashed var(--line);padding:8px;margin:6px 0;border-radius:3px}
.empty{color:var(--dim);padding:10px 0}
.bigdec{font-family:var(--f-display);font-size:26px;line-height:1.05;text-transform:uppercase;font-weight:600}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
form.f label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim);min-width:0}
.panel input,.panel select,.panel textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:6px 8px;color:var(--ink);min-width:0;width:100%}
.kan{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;min-width:940px}
.kan>div{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:8px;min-height:90px}
.kcard{border-left:3px solid var(--dim);padding:4px 6px;margin-top:6px;font-size:12.5px;background:var(--panel)}
.kcard.okfilm{border-color:var(--okfilm)} .kcard.institute{border-color:var(--institute)} .kcard.school{border-color:var(--school)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:8px;align-items:flex-start}
/* agenda — notebook */
.book{background:var(--paper);color:#22201b;border-radius:3px 10px 10px 3px;padding:18px 18px 22px 30px;position:relative;
  box-shadow:inset 12px 0 14px -10px rgba(0,0,0,.28);font-family:var(--f-paper);font-size:16px;min-width:0}
.book::after{content:"";position:absolute;top:0;right:34px;width:12px;height:64px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.book h2{font-family:var(--f-paper);font-weight:500;font-size:27px;text-transform:none;letter-spacing:0}
.book .sub{font-style:italic;color:#6a6456;font-size:14.5px}

.tl{display:grid;grid-template-columns:86px 1fr;column-gap:10px}
.tl .t{font-family:var(--f-mono);font-size:11.5px;color:#6a6456}
.tl .e{min-width:0;overflow-wrap:anywhere}
.inkwrap{position:relative;border:1px solid var(--paper-rule);margin-top:10px;background-image:radial-gradient(var(--paper-rule) 1px,transparent 1px);background-size:14px 14px}
canvas#ink{display:block;width:100%;height:260px;touch-action:none}
.book .btn{background:none;border-color:#b7ac90;color:#22201b;font-size:13px}
.book .btn[aria-pressed="true"]{background:#22201b;color:var(--paper)}
.book textarea{background:transparent;border:0;width:100%;min-height:84px;font:inherit;line-height:28px;color:inherit;resize:vertical;padding:0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid button{background:none;border:1px solid var(--paper-rule);padding:3px 2px;min-height:44px;font-family:var(--f-mono);font-size:11px;color:#22201b;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.mgrid button.out{opacity:.3} .mgrid button.today{border-color:#22201b;border-width:2px} .mgrid button.sel{background:rgba(0,0,0,.08)}
.mgrid i{display:block;height:4px;border-radius:2px}
/* bottom bar (phone) */
.bottom{display:none}
@media (max-width:900px){

  .mast{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}

    padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:6px;align-items:center}

}
.stage{position:relative;width:100%;aspect-ratio:16/10;max-height:62vh;min-height:240px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--shell)}

.split.lib{grid-template-columns:minmax(0,7fr) minmax(0,4fr)}

.seatbtn{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--ink);min-width:0}
.seatbtn[aria-pressed="true"]{border-color:var(--info);box-shadow:inset 0 0 0 1px var(--info)}

.panel .btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

<script>
"use strict";
/* ================= Subreal Manager — Project B =================
   Owns: layout, agenda pages, ink, planning cards, private routines, game XP display.
   Does NOT own operational truth. Tasks, runs, artifacts and approvals come from the core (Project A)
   through contract v0.1: a snapshot + ordered events, and validated commands. */

const PLAN_START = "2026-11-17";           // Gün 1 of the re-anchored 90-day plan
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("srm:"+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("srm:"+k, JSON.stringify(v)); return true; }catch(e){ return false; } },

async function loadFixture(){

    S.lastSync = f.snapshot.generated_at;
  }catch(e){
    S.snap = emptySnap(); S.events = []; S.details = {}; S.bodies = {}; S.stale = true; S.staleWhy = "Kayıt dosyası okunamadı.";

}
function emptySnap(){ return {schema_version:"0.1",generated_at:new Date().toISOString(),cursor:0,simulation:false,offices:[],agents:[],tasks:[],runs:[],artifacts:[]}; }
async function api(path, opt={}){
  const r = await fetch(S.live.url+path, {...opt, headers:{"Authorization":"Bearer "+S.live.token,"Content-Type":"application/json"}});
  return r.json();
}
async function loadLive(){
  try{
    const snap = await api("/v0/snapshot");
    if(snap.schema_version !== "0.1") throw new Error("sözleşme sürümü uyuşmuyor");
    const ev = await api("/v0/events?since=0");
    S.snap = snap; S.events = ev.events || []; S.details = {}; S.bodies = {}; S.stale = false; S.lastSync = snap.generated_at;
  }catch(e){
    // never invent progress: keep the last snapshot and say it is stale
    S.stale = true; S.staleWhy = "Çekirdeğe ulaşılamıyor ("+esc(e.message||e)+"). Gösterilen durum son başarılı eşitlemeye aittir.";

}

function buildCommand(office, action, params, expected){
  const c = {command_id:uid("cmd"), idempotency_key:uid("mgr"), actor:{id:"owner",client:"subreal-manager"}, scope:{office}, action, params};
  if(expected != null) c.expected_version = expected;
  return c;
}
async function submit(cmd, label){
  if(S.mode === "rehearsal"){ applyRehearsal(cmd); toast("Prova: sentetik depoya uygulandı. Çekirdeğe hiçbir şey gönderilmedi."); render(); return; }
  if(S.mode === "live" && !S.stale){
    try{
      const r = await api("/v0/commands", {method:"POST", body:JSON.stringify(cmd)});
      if(r.ok) toast("Çekirdek kabul etti: "+label); else toast("Çekirdek reddetti ("+r.error.code+"): "+r.error.message);
      await reload(); return;
    }catch(e){ S.stale = true; S.staleWhy = "Komut gönderilemedi; bağlantı koptu."; }
  }
  outbox.push({cmd, label, at:new Date().toISOString()}); LS.set("outbox", outbox);
  toast("Gönderilmedi — komut giden kutusunda bekliyor."); render();
}
function applyRehearsal(cmd){
  const p = cmd.params, snap = rehearsal.snap;
  if(cmd.action === "task.create") snap.tasks.push({task_id:uid("sim"),office:cmd.scope.office,title:"[PROVA] "+p.title,workflow:p.workflow,state:"queued",version:2,due:p.due||null,priority:p.priority||null,kind:p.kind||null,created_at:rehearsal.clock,updated_at:rehearsal.clock});
  if(cmd.action === "approval.decide"){ const t = snap.tasks.find(x => x.task_id === p.task_id); if(t){ t.state = p.decision === "accept" ? "accepted" : "queued"; t.version++; } }
  if(cmd.action === "task.cancel"){ const t = snap.tasks.find(x => x.task_id === p.task_id); if(t){ t.state = "cancelled"; t.version++; } }
}
function cliFor(cmd){
  const p = cmd.params;
  if(cmd.action === "task.create") return `python3 -m offices create ${cmd.scope.office} ${p.workflow} ${JSON.stringify(p.title)}`+(p.due?` --due ${p.due}`:"")+(p.priority?` --priority ${p.priority}`:"")+(p.kind?` --kind ${p.kind}`:"");
  if(cmd.action === "approval.decide") return `python3 -m offices review ${p.task_id} ${p.decision} --sha ${p.artifact_sha256}`;
  if(cmd.action === "task.cancel") return `python3 -m offices cancel ${p.task_id}`;
  return JSON.stringify(cmd);
}

function actionable(){ // what "Devam Et" walks through, in this order. It only navigates.

function initInk(){
  const cv = $("#ink"); if(!cv) return;
  const ctx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio||1), r = cv.getBoundingClientRect();
  cv.width = Math.max(1, r.width*dpr); cv.height = Math.max(1, r.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap = ctx.lineJoin = "round";
  const saved = LS.get("ink:"+agDay, null);
  if(saved){ const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = saved; }
  let drawing = false, last = null;
  const pos = e => { const b = cv.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; };
  cv.onpointerdown = e => { if(penOnly && e.pointerType !== "pen") return; drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); };
  cv.onpointermove = e => { if(!drawing) return; const p = pos(e), pr = e.pressure > 0 ? e.pressure : .5;
    const era = inkMode === "era" || e.buttons === 32; // 32 = stylus eraser button
    ctx.globalCompositeOperation = era ? "destination-out" : "source-over"; ctx.strokeStyle = "#1d2a44"; ctx.lineWidth = era ? 18 : Math.max(.7, pr*3.2);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; };
  const end = () => { if(!drawing) return; drawing = false; if(!LS.set("ink:"+agDay, cv.toDataURL("image/png"))) toast("Mürekkep kaydedilemedi: tarayıcı depolaması dolu ya da kapalı."); };
  cv.onpointerup = end; cv.onpointercancel = end;
}

let ENST = null, libRoom = LS.get("libRoom", "okuma"), libSeat = null;
async function loadEnst(){ if(ENST) return ENST; try{ const r = await fetch("enstitut.json", {cache:"no-store"}); ENST = await r.json(); }catch(e){ ENST = {rooms:[], seats:[], failed:true}; } return ENST; }
function seatTasks(seat){
  const all = S.snap?.tasks || [];
  let ts = [];
  if(seat.agent){ const ids = new Set((S.snap?.runs || []).filter(r => r.agent === seat.agent).map(r => r.task_id)); ts = all.filter(t => ids.has(t.task_id)); }
  else if(seat.project) ts = all.filter(t => t.project === seat.project);
  const rank = {running:0, awaiting_review:1, awaiting_approval:1, queued:2, draft:3, failed:4, accepted:5, cancelled:6};
  return ts.slice().sort((a,b) => rank[a.state]-rank[b.state] || (b.updated_at||"").localeCompare(a.updated_at||""));
}
function seatInfo(seat){
  const t = seatTasks(seat)[0];
  if(!t) return {task:null, question:seat.open || null, source:null, next:null};
  const ev = (S.details[t.task_id]?.evidence || []).map(e => (e.locator||"").split(":")[0]).filter(Boolean);
  const files = [...new Set(ev)], art = latestArt(t.task_id);
  const next = t.state === "awaiting_review" && art ? `${art.name} v${art.version} — incelemeni bekliyor`
    : t.state === "accepted" ? "Kabul edildi; açık teslim yok" : t.state === "failed" ? "Koşu başarısız; yeniden sıraya alınmayı bekliyor"
    : t.due ? `${fmt(t.due)} · ${STATE_TR[t.state]}` : `Tarihsiz · ${STATE_TR[t.state]}`;
  return {task:t, question:t.title, source:files.length ? files.join(", ") : null, next};
}

    const t = S.snap.tasks.find(x => x.task_id === id), art = latestArt(id);
    const cmd = buildCommand(t.office, "approval.decide", {task_id:id, subject:"review", decision:b.dataset.d, artifact_sha256:art.sha256}, t.version);

  }
  if(a === "intake-done"){ LS.set("intakeWeek", weekKey(TODAY)); toast("Bu haftanın toplantısı kapatıldı."); return render(); }
  if(a === "copy" || a === "copyjson"){ const o = outbox[+b.dataset.i]; const txt = a === "copy" ? cliFor(o.cmd) : JSON.stringify(o.cmd, null, 2);
    try{ await navigator.clipboard.writeText(txt); toast("Kopyalandı."); }catch(_){ toast("Kopyalanamadı; metni elle seç."); } return; }
  if(a === "drop"){ outbox.splice(+b.dataset.i, 1); LS.set("outbox", outbox); return render(); }
  if(a === "resend"){ const o = outbox.splice(+b.dataset.i, 1)[0]; LS.set("outbox", outbox); return submit(o.cmd, o.label); }
  if(a === "sent-hint"){ $("#sent-out").innerHTML = `<p class="lbl">${esc(DECK[sentenceIdx()][2])}</p>`; return; }
  if(a === "r-ok"){ const R = LS.get("routines", {on:true, ok:{}}); R.ok[id] = b.checked; LS.set("routines", R); return; }
  if(a === "ag"){ agDay = addDays(agDay, +b.dataset.n); if(agDay < "2026-11-17") agDay = "2026-11-17"; if(agDay > "2027-12-31") agDay = "2027-12-31"; return render(); }

  if(a === "ag-go"){ agDay = b.dataset.d; return render(); }
  if(a === "ag-m"){ const d = D(agDay); d.setDate(1); d.setMonth(d.getMonth()+ +b.dataset.n); agDay = iso(d); if(agDay < "2026-11-17") agDay = "2026-11-17"; if(agDay > "2027-12-31") agDay = "2027-12-01"; return render(); }

    if(g.office === "school") return toast("Okul hedefleri ders akışıyla ilerler; görev komutu hazırlanmadı.");
    return submit(buildCommand(g.office, "task.create", {title:g.t, workflow:WORKFLOWS[g.office], due, kind:"research", priority:"normal"}), "Yeni görev: "+g.t); }
  if(a === "goal-date"){ $("#goalForm").innerHTML = `<form class="f" id="gForm" data-id="${id}" style="margin-top:10px"><label>Sonraki somut adım<input id="g-step" required maxlength="160"></label><label>Tarih<input id="g-date" type="date" required min="${TODAY}"></label><button class="btn go" type="submit">Kaydet</button></form>`; $("#g-step").focus(); return; }
  if(a === "enter-sim"){ if(S.mode !== "rehearsal") setMode("rehearsal"); return; }
  if(a === "exit-sim"){ return setMode("fixture"); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id === "jobForm"){
    const office = $("#j-office").value, p = {title:$("#j-title").value.trim(), workflow:WORKFLOWS[office], kind:$("#j-kind").value, priority:$("#j-prio").value};
    if($("#j-due").value) p.due = $("#j-due").value;
    if(!p.title) return;
    submit(buildCommand(office, "task.create", p), "Yeni iş: "+p.title);
  }
  if(e.target.id === "sentForm"){ const c = DECK[sentenceIdx()], a = $("#sent-in").value; if(!a.trim()) return;
    LS.set("sentence:"+TODAY, {a, ok:norm(a) === norm(c[1])}); render(); }
  if(e.target.id === "gForm"){ const gs = goals(), g = gs.find(x => x.id === e.target.dataset.id);
    g.next = {step:$("#g-step").value.trim(), date:$("#g-date").value}; LS.set("goals", gs); render(); }
  if(e.target.id === "connForm"){ S.live.url = $("#c-url").value.trim().replace(/\/$/,""); S.live.token = $("#c-token").value; setMode("live"); }
});
document.addEventListener("change", e => {
  if(e.target.id === "r-on"){ const R = LS.get("routines", {on:false, ok:{}}); R.on = e.target.checked; LS.set("routines", R); render(); }
});
document.addEventListener("input", e => { if(e.target.id === "ag-note") LS.set("note:"+agDay, e.target.value); });
document.addEventListener("keydown", e => {
  const tag = e.target.tagName, typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable;
  if(e.code === "Space" && !typing && tag !== "BUTTON" && tag !== "A" && tag !== "SUMMARY"){ e.preventDefault(); devam(); }
  if(e.key === "Enter" && e.target.matches("tr.row")) e.target.click();
  if(!typing && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !e.target.closest("canvas")){
    const i = VIEWS.findIndex(v => v[0] === view()); location.hash = VIEWS[(i + (e.key === "ArrowRight" ? 1 : VIEWS.length-1)) % VIEWS.length][0]; }
});
$("#devam").onclick = devam; $("#devam2").onclick = devam;
function applySkin(k){ const r = document.documentElement; r.removeAttribute("data-skin"); r.removeAttribute("data-theme");
  if(k === "menajer") r.setAttribute("data-skin", "menajer"); else if(k === "fildisi-acik") r.setAttribute("data-theme", "light"); else r.setAttribute("data-theme", "dark"); }
const SKINS = [["menajer","Menajer (koyu)"],["fildisi-koyu","Grafit + fildişi"],["fildisi-acik","Açık"]];
$("#themeBtn").onclick = () => { const i = SKINS.findIndex(x => x[0] === LS.get("skin","menajer")), n = SKINS[(i+1) % SKINS.length];
  LS.set("skin", n[0]); applySkin(n[0]); toast("Görünüm: "+n[1]); };
$("#modeBtn").onclick = () => {
  $("#banner").innerHTML = `<div class="panel"><h3>Veri kaynağı</h3>
    <p>Şu an: <b>${S.mode === "live" ? "canlı çekirdek" : S.mode === "rehearsal" ? "prova (sentetik)" : "kayıt (çekirdekten dışa aktarılmış anlık görüntü)"}</b>. Canlı bağlantı yalnızca bu sayfa çekirdekle aynı bilgisayarda yerel olarak açıldığında çalışır; claude.ai üzerinde yayınlanan kopya yerel ağına ulaşamaz.</p>
    <form class="f" id="connForm"><label>Çekirdek adresi<input id="c-url" value="${esc(S.live.url)}"></label><label>Belirteç (yalnızca bu oturumda tutulur)<input id="c-token" type="password" autocomplete="off"></label><button class="btn go" type="submit">Canlı bağlan</button></form>
    <div class="row-actions"><button class="btn" type="button" data-act="exit-sim">Kayda dön</button><button class="btn" type="button" data-act="enter-sim">Prova modu</button></div></div>`;
};
window.addEventListener("hashchange", () => { render(); $("#view").focus({preventScroll:true}); });
(function boot(){
  applySkin(LS.get("skin", "menajer"));
  S.snap = emptySnap(); render(); reload();
  try{ if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {}); }catch(e){}
  setInterval(() => { if(S.mode === "live") reload(); }, 15000);
})();
</script>

</body></html>
